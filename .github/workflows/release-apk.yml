name: Release APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - 'package*.json'
      - 'tests/**'
      - 'scripts/**'
      - 'release-cert.sha256'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: satimod-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Version
        run: |
          echo "RELEASE_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=0.4.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: JavaScript tests
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      - name: Android SDK
        run: |
          sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Android tests, lint and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease -PreleaseVersionCode="$RELEASE_CODE" -PreleaseVersionName="$RELEASE_NAME"
      - name: Sign and verify
        env:
          SATIMOD_SIGNING_JSON: ${{ secrets.SATIMOD_SIGNING_JSON }}
        run: python3 scripts/sign_release.py
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_NAME}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" != true ]; then
              echo 'This version is already published; do not replace an installed version.'
              exit 1
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "SatiMod ${RELEASE_NAME}" --notes-file dist/release-notes.md
          fi
          gh release upload "$tag" dist/SatiMod-arm64.apk dist/SHA256SUMS.txt dist/release.json --clobber
          gh release edit "$tag" --draft=false --latest
          echo "Download: https://github.com/${GH_REPO}/releases/latest/download/SatiMod-arm64.apk" >> "$GITHUB_STEP_SUMMARY"
