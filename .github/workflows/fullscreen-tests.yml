name: Fullscreen regression tests
on:
  pull_request:
    paths:
      - 'app/src/main/assets/controller/**'
      - 'app/src/main/java/jp/flowview/android/Fullscreen*.java'
      - 'app/src/main/java/jp/flowview/android/MainActivity.java'
      - 'app/src/main/java/jp/flowview/android/PlaybackService.java'
      - 'app/src/test/**'
      - 'tests/**'
      - 'app/build.gradle'
      - '.github/workflows/fullscreen-tests.yml'
      - '.github/workflows/release-apk.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      - run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.2' 'build-tools;37.0.0'
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease
